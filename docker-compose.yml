services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
    - "6333:6333"
    volumes:
    -  qdrant_data:/qdrant/storage
  
  redis:
    image: redis:latest
    ports:
    - "6379:6379"
    volumes:
    - redis_data:/redis
  
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  
  prometheus:
    image: prom/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - 9090:9090
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
  
  grafana:
    image: grafana/grafana
    env_file:
      - .env
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}
  
  app:
    build: .
    env_file:
    - .env
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./app:/main/app
      - ./db:/main/db
      - ./docs:/main/docs
      - ./logs:/main/logs
      - ./eval:/main/eval
  
volumes:
  qdrant_data:
  redis_data:
  ollama_data:
  app:
  db:
  docs:
  logs:
  eval: