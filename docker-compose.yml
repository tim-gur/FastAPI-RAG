services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
    - "6333:6333"
    volumes:
    -  qdrant_data:/qdrant/storage
  
  redis:
    image: redis:latest
    ports:
    - "6379:6379"
    volumes:
    - redis_data:/redis
  
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
  
  app:
    build: .
    env_file:
    - .env
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./app:/main/app
      - ./db:/main/db
  
volumes:
  qdrant_data:
  redis_data:
  ollama_data:
  app:
  db: